name: Deploy to Cloudflare (staging)

# Deploys the OpenNext Worker to staging.bulgariandesigncouncil.org.
# Runs on every push to main, and can be triggered manually from the Actions tab.
#
# Staging is the gate: main lands here and nowhere else. The live apex is a
# separate Worker shipped only by deploy-production.yml, by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; a newer push cancels an in-flight one.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # opennextjs-cloudflare build + deploy; wrangler reads these two env vars.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
