name: Sync events from Notion

# Pulls the Събития tab into lib/events.generated.json and commits the result to
# main when it changed.
#
# ON DEMAND ONLY. It used to run every eight hours, and that schedule was
# deleted rather than paused, for two reasons.
#
# The first is that it never once worked: NOTION_TOKEN was never set, so all 23
# scheduled runs failed, every eight hours, mailing a failure notice each time.
# A red job nobody can fix without a decision is worse than no job — it teaches
# everyone to ignore the Actions tab, which is where a real breakage would also
# appear.
#
# The second is the decision itself. The council keeps the Notion credential in
# Cloudflare, where the staging editor uses it, and deliberately does not put one
# in this public repository. Without a token here there is nothing to schedule.
# Events reach the site when someone asks for them, which for a handful of events
# a month is the honest trade: fewer moving parts, and nothing publishes itself
# unlooked-at.
#
# To turn the schedule back on you need `gh secret set NOTION_TOKEN` with a
# READ-ONLY integration first — see AGENTS.md — and then restore the `schedule:`
# key below. Scheduled workflows only run from the default branch, so this file
# has to be on main to fire at all.
on:
  workflow_dispatch:

# Let the job commit the regenerated JSON.
permissions:
  contents: write

# A manual run while the scheduled one is mid-flight would race on the same
# file; queue instead of cancelling, so a started sync always finishes.
concurrency:
  group: sync-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Exits non-zero when Notion returns no publishable rows, which leaves the
      # committed JSON alone rather than blanking the section on the live site.
      - name: Pull events
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_EVENTS_DATA_SOURCE_ID: ${{ vars.NOTION_EVENTS_DATA_SOURCE_ID }}
          # Which Notion columns count as publishable — a comma-separated list,
          # default "Готово за публикуване, Публикувано". Set the variable to
          # move the site to other columns without touching this workflow.
          NOTION_EVENTS_STATUS: ${{ vars.NOTION_EVENTS_STATUS }}
        run: npm run sync:events

      - name: Install browser for component checks
        run: npx playwright install --with-deps chromium

      - name: Check authored code
        run: npm run lint

      - name: Run component and accessibility checks
        run: npm test

      # The sync output is deterministic, so an unchanged Notion means an
      # unchanged file and no commit — the schedule stays quiet on quiet days.
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- lib/events.generated.json; then
            echo "No change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/events.generated.json
          git commit -m "Events: sync from Notion"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN deliberately does not start other
      # workflows, so deploy.yml will not see the commit above. Deploy from here
      # instead — same command and secrets it uses.
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
